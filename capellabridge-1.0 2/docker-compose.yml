# Replace YOUR_GITHUB_USERNAME once with your GitHub username (lowercase). No .env file required.
# The first-run login is created automatically; read it with: docker logs capellabridge
services:
  capellabridge:
    image: ghcr.io/YOUR_GITHUB_USERNAME/capellabridge:latest
    platform: linux/amd64
    pull_policy: always
    container_name: capellabridge
    restart: unless-stopped
    init: true
    ports:
      - "8765:8080"
    volumes:
      - capellabridge_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 160
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777

volumes:
  capellabridge_data:
